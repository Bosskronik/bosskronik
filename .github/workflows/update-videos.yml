name: Update latest videos

on:
  schedule:
    # Every 6 hours. GitHub can start a scheduled run a few minutes late.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull public YouTube videos
        run: python3 scripts/update_videos.py

      - name: Commit and push when the list changed
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "No change in the public video list."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "Update latest videos from the public YouTube feed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
